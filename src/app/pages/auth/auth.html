<div dir="rtl" class="w-full h-screen bg-gray-100 dark:bg-gray-950 flex items-center justify-center">
  <div class="grid place-items-center w-4/5 h-4/5">
    @switch (card()) {
    @case ('login') {
    <form
      class="flex flex-col justify-items-center items-center gap-4 dark:text-white rounded-4xl col-start-1 row-start-1"
      animate.enter="card-open" animate.leave="card-switch" (submit)="this.loginSubmit($event)">
      <h1 class="font-bold text-3xl w-full">ورود</h1>
      <div class="flex flex-col gap-2">
        <vira-field [field]="loginForm.username">
          <vira-auth-input kind="username" [to]="loginForm.username" />
        </vira-field>
        <vira-field [field]="loginForm.password">
          <vira-auth-input kind="password" [to]="loginForm.password" />
        </vira-field>
      </div>
      <div class="flex flex-col gap-4 w-full">
        <input type="submit" value="ورود"
          class="text-white dark:text-black font-semibold bg-gray-900 dark:bg-white w-full py-2 rounded-xl cursor-pointer active:scale-98 transition-all hover:bg-black/80 dark:hover:bg-white/80" />
        <div class="flex flex-col w-full items-center gap-1">
          <vira-separator />
          <button type="button" (click)="card.set('signup')"
            class="text-black dark:text-white font-semibold bg-white dark:bg-black w-full py-2 rounded-xl cursor-pointer active:scale-98 transition-all hover:opacity-80 border border-gray-300 dark:border-white">ثبت‌نام</button>
        </div>
      </div>
    </form>
    }
    @case ('signup') {
    <form
      class="flex flex-col justify-items-center items-center gap-4 dark:text-white rounded-4xl col-start-1 row-start-1"
      animate.enter="card-open" animate.leave="card-switch" (submit)="this.signUpSubmit($event)">
      <h1 class="font-bold text-3xl w-full">ثبت‌نام</h1>
      <div class="flex flex-col gap-2">
        <vira-field [field]="signupForm.username">
          <vira-auth-input kind="username" [to]="signupForm.username" />
        </vira-field>
        <vira-field [field]="signupForm.email">
          <vira-auth-input kind="email" [to]="signupForm.email" />
        </vira-field>
        <vira-field [field]="signupForm.password">
          <vira-auth-input kind="password" [to]="signupForm.password" />
        </vira-field>
      </div>
      <div class="flex flex-col gap-4 w-full">
        <input type="submit" value="ساخت حساب کاربری"
          class="text-white dark:text-black font-semibold bg-gray-900 dark:bg-white w-full py-2 rounded-xl cursor-pointer active:scale-98 transition-all hover:bg-black/80 dark:hover:bg-white/80" />
        <div class="flex flex-col w-full items-center gap-1">
          <vira-separator />
          <button type="button" (click)="card.set('login')"
            class="text-black dark:text-white font-semibold bg-white dark:bg-black w-full py-2 rounded-xl cursor-pointer active:scale-98 transition-all hover:opacity-80 border border-gray-300 dark:border-white">ورود</button>
        </div>
      </div>
    </form>
    }
    }
  </div>
</div>
