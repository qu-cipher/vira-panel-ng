<div dir="rtl" class="w-full min-h-dvh px-4 bg-gray-200 dark:bg-gray-950 flex items-center justify-center font-[vazir]">
    <div class="flex flex-col items-center gap-6 text-center max-w-md">
        <div class="text-gray-900 dark:text-white bg-white dark:bg-gray-900 p-3 rounded-2xl">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 9.5a4.25 4.25 0 0 1-.5 8.5z" />
                <path d="M10 11l4 4M14 11l-4 4" />
            </svg>
        </div>

        <div class="flex flex-col gap-2">
            <h1 class="text-7xl font-bold text-gray-900 dark:text-white">۴۰۴</h1>
            <p class="text-xl font-bold text-gray-900 dark:text-white">صفحه پیدا نشد</p>
            <p class="text-sm text-gray-600 dark:text-white/50">
                صفحه‌ای که دنبالش هستید وجود ندارد یا جابه‌جا شده است.
            </p>
        </div>

        <div class="flex flex-col sm:flex-row gap-2 w-full">
            <a routerLink="/"
                class="flex-1 text-center text-white dark:text-black font-semibold bg-gray-900 dark:bg-white py-2 rounded-xl cursor-pointer active:scale-98 transition-all hover:bg-black/80 dark:hover:bg-white/80">
                بازگشت به خانه
            </a>
            <button type="button" (click)="goBack()"
                class="flex-1 text-black dark:text-white font-semibold bg-white dark:bg-black py-2 rounded-xl cursor-pointer active:scale-98 transition-all hover:opacity-80 border border-gray-300 dark:border-white">
                صفحه قبل
            </button>
        </div>
    </div>
</div>
