<div class="flex gap-2 items-center justify-center text-gray-800 dark:text-white border-2 border-black/20 dark:border-white/20 p-2 rounded-xl">
    @switch (kind()) {
        @case ('email') {
            <svg xmlns="http://www.w3.org/2000/svg" [attr.width]="size()" [attr.height]="size()"
                viewBox="0 0 24 24"><!-- Icon from ProIcons by ProCode - https://github.com/ProCode-Software/proicons/blob/main/LICENSE -->
                <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
                    <rect width="18.5" height="15.5" x="2.75" y="4.25" rx="3" />
                    <path d="m2.75 8l8.415 3.866a2 2 0 0 0 1.67 0L21.25 8" />
                </g>
            </svg>
            <input type="text" placeholder="ایمیل" class="focus:outline-none" [formField]="to()">
        }
        @case ('username') {
            <svg xmlns="http://www.w3.org/2000/svg" [attr.width]="size()" [attr.height]="size()"
                viewBox="0 0 24 24"><!-- Icon from ProIcons by ProCode - https://github.com/ProCode-Software/proicons/blob/main/LICENSE -->
                <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                    d="M19 20.75a1 1 0 0 0 1-1v-1.246c.004-2.806-3.974-5.004-8-5.004s-8 2.198-8 5.004v1.246a1 1 0 0 0 1 1zM15.604 6.854a3.604 3.604 0 1 1-7.208 0a3.604 3.604 0 0 1 7.208 0" />
            </svg>
            <input type="text" placeholder="نام کاربری" class="focus:outline-none" [formField]="to()">
        }
        @case ('password') {
            <svg xmlns="http://www.w3.org/2000/svg" [attr.width]="size()" [attr.height]="size()"
                viewBox="0 0 24 24"><!-- Icon from ProIcons by ProCode - https://github.com/ProCode-Software/proicons/blob/main/LICENSE -->
                <g fill="none">
                    <path stroke="currentColor" stroke-linejoin="round" stroke-width="1.387"
                        d="M14.775 2.75a6.475 6.475 0 1 1-3.38 11.998c-.137-.085-.32.011-.32.173v1.129a1.5 1.5 0 0 1-1.5 1.5h-1.2a1 1 0 0 0-1 1v1.2a1.5 1.5 0 0 1-1.5 1.5H4.25a1.5 1.5 0 0 1-1.5-1.5v-2.297a2 2 0 0 1 .586-1.414l4.566-4.566c.376-.376.511-.923.446-1.452a6.475 6.475 0 0 1 6.427-7.271Z" />
                    <circle cx="15.5" cy="8.5" r="1.75" fill="currentColor" />
                </g>
            </svg>
            <input type="text" placeholder="رمز عبور" class="focus:outline-none" [formField]="to()">
        }
    }
</div>
