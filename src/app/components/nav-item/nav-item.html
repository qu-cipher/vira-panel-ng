<a [routerLink]="link()" routerLinkActive ariaCurrentWhenActive="page"
    class="w-full flex gap-1 items-center p-2 select-none cursor-pointer text-black/50 dark:text-white/80 rounded-lg hover:bg-gray-300/70 dark:hover:bg-gray-900 active:scale-98 transition-all
           aria-[current=page]:bg-gray-300 aria-[current=page]:text-black dark:aria-[current=page]:bg-white/10 dark:aria-[current=page]:text-white">
    @switch (kind()) {
        @case ('overview') {
            <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 11l9-8 9 8M5 9.5V20h5v-6h4v6h5V9.5"></path>
            </svg>
        }
        @case ('plans') {
            <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 3l9 5-9 5-9-5 9-5zM3 13l9 5 9-5M3 17.5l9 5 9-5"></path>
            </svg>
        }
        @case ('wallet') {
            <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6M9 16h3"></path>
            </svg>
        }
        @case ('profile') {
            <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0"></path>
            </svg>
        }
        @case ('settings') {
            <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M10.26 5.22L10.66 2.59L13.34 2.59L13.74 5.22L15.56 5.97L17.70 4.40L19.60 6.30L18.03 8.44L18.78 10.26L21.41 10.66L21.41 13.34L18.78 13.74L18.03 15.56L19.60 17.70L17.70 19.60L15.56 18.03L13.74 18.78L13.34 21.41L10.66 21.41L10.26 18.78L8.44 18.03L6.30 19.60L4.40 17.70L5.97 15.56L5.22 13.74L2.59 13.34L2.59 10.66L5.22 10.26L5.97 8.44L4.40 6.30L6.30 4.40L8.44 5.97ZM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"></path>
            </svg>
        }
    }
    <p class="font-[vazir]"> {{ text() }} </p>
</a>
