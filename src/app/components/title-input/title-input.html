<div class="flex flex-col w-full gap-0">
  <div class="flex flex-col w-full gap-1">
    <p class="text-sm font-bold text-black/50 dark:text-white/50">
      {{ this.title() }}
      @if(this.required()) {
        <span class="text-red-600">*</span>
      }
    </p>
    <div class="w-full flex gap-2">
      <input
        [type]="type()"
        [value]="this.value()"
        (input)="onInput($event)"
        [placeholder]="placeholder()"
        class="w-full border border-gray-300 dark:border-gray-700 bg-white dark:bg-transparent text-black dark:text-white rounded-lg p-2 text-sm outline-none transition-all"      />

      <ng-content />
    </div>
  </div>
  <p class="text-black/50 dark:text-white/50 text-xs px-2 w-full">{{ this.desc() }}</p>
</div>
